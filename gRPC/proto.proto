syntax = "proto3";

option go_package = "github.com/bertram-a11y/Consensus_Golfers/gRPC";

service Node {
  rpc GetNode (Request) returns (Reply) {}
}

// The request message containing the user's name.
message Request {
  string content = 1;
  int64 clock = 2;
}

// The response message containing the greetings
message Reply {
  string content = 1;
  int64 clock = 2;
}